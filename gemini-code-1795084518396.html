<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListeningMemo - Sheets Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full max-w-md flex items-center justify-between py-2 gap-2">
        <div class="min-w-0">
            <div class="flex items-center space-x-1.5">
                <h1 class="text-base font-bold tracking-tight text-indigo-400 truncate">ListeningMemo</h1>
                <span id="filter-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60">候補のみ</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate">
                対象: <strong id="total-count" class="text-slate-200">0</strong>曲 / 残り <strong id="remaining-count" class="text-indigo-300">0</strong>曲
            </p>
            <p id="sync-status" class="text-[10px] text-slate-500 truncate">未同期</p>
        </div>
        <div class="flex items-center space-x-1 shrink-0">
            <button type="button" id="sync-btn" title="スプレッドシートから最新データを取得" class="px-2 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-emerald-300 hover:text-emerald-200 transition cursor-pointer">同期</button>
            <button type="button" id="reset-btn" title="履歴と山札をリセット" class="px-2 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-400 hover:text-slate-200 transition cursor-pointer">リセット</button>
            <div class="flex bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-[11px]">
                <button type="button" id="mode-6-btn" class="px-2 py-1 rounded-md bg-indigo-600 text-white font-medium transition cursor-pointer">全項目</button>
                <button type="button" id="mode-3-btn" class="px-2 py-1 rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer">シンプル</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center my-auto py-2 space-y-4">

        <!-- Card Display -->
        <div id="card-container" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden transition-all duration-200 flex flex-col justify-between">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>

            <div class="space-y-3">
                <!-- Top Metadata Row -->
                <div class="flex flex-wrap gap-1.5 items-center justify-between">
                    <span id="card-no" class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/60">No. --</span>
                    <div id="meta-badges" class="flex flex-wrap gap-1">
                        <span id="card-mood" class="text-[10px] bg-purple-950/80 text-purple-300 border border-purple-800/50 px-2 py-0.5 rounded">mood: --</span>
                        <span id="card-texture" class="text-[10px] bg-sky-950/80 text-sky-300 border border-sky-800/50 px-2 py-0.5 rounded">texture: --</span>
                    </div>
                </div>

                <!-- Track Name & Artist Name(s) -->
                <div>
                    <h2 id="card-title" class="text-lg font-bold text-white leading-snug tracking-wide">読み込み中...</h2>
                    <p id="card-artist" class="text-xs text-indigo-300 font-medium mt-0.5"></p>
                </div>

                <!-- Points Tags -->
                <div id="points-wrapper" class="pt-0.5">
                    <div id="card-points" class="flex flex-wrap gap-1"></div>
                </div>

                <!-- Listening Memo -->
                <div class="border-t border-slate-800/90 pt-2.5">
                    <div class="flex items-center justify-between mb-1.5">
                        <h3 class="text-[11px] font-semibold text-slate-400 tracking-wider">Listening Memo</h3>
                    </div>
                    <div id="card-memo" class="text-xs text-slate-200 space-y-1.5 leading-relaxed max-h-52 overflow-y-auto pr-1">
                    </div>
                </div>
            </div>

            <!-- Spotify Embed Player -->
            <div id="spotify-embed-container" class="pt-3.5 mt-3.5 border-t border-slate-800/90 hidden">
                <iframe id="spotify-iframe"
                    class="rounded-xl w-full"
                    height="80"
                    frameBorder="0"
                    allowtransparency="true"
                    allow="encrypted-media">
                </iframe>
            </div>

            <!-- Clipboard Helper -->
            <div class="pt-2.5 mt-2.5 flex items-center justify-between gap-2 text-[11px]">
                <button type="button" id="copy-query-btn" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition cursor-pointer">
                    曲名・アーティストをコピー
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full flex flex-col space-y-2.5">
            <button id="draw-btn" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-indigo-600/30 transition duration-150 text-sm tracking-wider flex items-center justify-center space-x-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span id="draw-btn-text">カードを引く</span>
            </button>

            <button id="back-btn" type="button" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 text-slate-300 font-semibold py-2.5 px-4 rounded-2xl border border-slate-800 transition duration-150 text-xs tracking-wider flex items-center justify-center space-x-1.5 cursor-pointer opacity-40 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span>前へ戻る</span>
            </button>
        </div>

    </main>

    <!-- Footer / Settings Modal Trigger -->
    <footer class="w-full max-w-md flex items-center justify-between py-1 text-[10px] text-slate-500 px-1">
        <span>Google Sheets CSV Sync</span>
        <button type="button" id="open-settings-btn" class="text-indigo-400 hover:underline cursor-pointer">シートURL設定</button>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/75 hidden items-center justify-center p-4 z-50">
        <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-white">スプレッドシート連携設定</h2>
                <button type="button" id="close-settings-btn" class="text-slate-400 hover:text-white text-xs cursor-pointer">閉じる</button>
            </div>
            <div class="space-y-1.5">
                <label for="csv-url-input" class="block text-[11px] text-slate-300">公開CSV URL（ウェブに公開 → CSV）</label>
                <input id="csv-url-input" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                <p class="text-[10px] text-slate-500 leading-relaxed">
                    ※URLはブラウザの保存領域に記録されます。初期値としてコード内の DEFAULT_CSV_URL も利用可能です。
                </p>
            </div>
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                    <input id="blog-only-checkbox" type="checkbox" class="rounded bg-slate-800 border-slate-600 text-indigo-600">
                    <span>ブログ候補のみ抽出（フラグ列が「ブログ候補」の行）</span>
                </label>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" id="save-sync-btn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition cursor-pointer">
                    保存して同期
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_CSV_URL = "";

        const CACHE_KEY = "listening_memo_sheets_cache_v2";
        const STATE_KEY = "listening_memo_sheets_state_v2";
        const CFG_KEY   = "listening_memo_sheets_cfg_v2";

        let tracksData = [];
        let currentItem = null;
        let cardHistory = [];
        let historyIndex = -1;
        let undrawnIndices = [];
        let showAllFields = true;

        const totalCountEl = document.getElementById('total-count');
        const remainingCountEl = document.getElementById('remaining-count');
        const syncStatusEl = document.getElementById('sync-status');
        const filterBadgeEl = document.getElementById('filter-badge');

        const cardNo = document.getElementById('card-no');
        const cardTitle = document.getElementById('card-title');
        const cardArtist = document.getElementById('card-artist');
        const cardMood = document.getElementById('card-mood');
        const cardTexture = document.getElementById('card-texture');
        const cardPoints = document.getElementById('card-points');
        const cardMemo = document.getElementById('card-memo');
        const metaBadges = document.getElementById('meta-badges');
        const pointsWrapper = document.getElementById('points-wrapper');
        const spotifyEmbedContainer = document.getElementById('spotify-embed-container');
        const spotifyIframe = document.getElementById('spotify-iframe');
        const copyQueryBtn = document.getElementById('copy-query-btn');

        const mode6Btn = document.getElementById('mode-6-btn');
        const mode3Btn = document.getElementById('mode-3-btn');
        const drawBtn = document.getElementById('draw-btn');
        const drawBtnText = document.getElementById('draw-btn-text');
        const backBtn = document.getElementById('back-btn');
        const syncBtn = document.getElementById('sync-btn');
        const resetBtn = document.getElementById('reset-btn');

        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const csvUrlInput = document.getElementById('csv-url-input');
        const blogOnlyCheckbox = document.getElementById('blog-only-checkbox');
        const saveSyncBtn = document.getElementById('save-sync-btn');

        function loadConfig() {
            try {
                const raw = localStorage.getItem(CFG_KEY);
                const cfg = raw ? JSON.parse(raw) : {};
                return {
                    csvUrl: (cfg.csvUrl || DEFAULT_CSV_URL || "").trim(),
                    blogOnly: Boolean(cfg.blogOnly)
                };
            } catch (e) {
                return { csvUrl: DEFAULT_CSV_URL.trim(), blogOnly: false };
            }
        }

        function saveConfig(cfg) {
            try {
                localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
            } catch (e) {}
        }

        function parseCSV(text) {
            const cleanText = String(text || "").replace(/^\uFEFF/, "");
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < cleanText.length; i++) {
                const ch = cleanText[i];
                const next = cleanText[i + 1];

                if (inQuotes) {
                    if (ch === '"' && next === '"') {
                        field += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        field += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        row.push(field);
                        field = "";
                    } else if (ch === '\r' && next === '\n') {
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = "";
                        i++;
                    } else if (ch === '\n' || ch === '\r') {
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = "";
                    } else {
                        field += ch;
                    }
                }
            }
            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }
            return rows;
        }

        function rowsToTracks(rows, blogOnly) {
            if (!rows || rows.length < 2) return [];
            const headers = rows[0].map(h => String(h || "").trim());
            const items = [];

            for (let r = 1; r < rows.length; r++) {
                const cells = rows[r];
                if (!cells || cells.every(c => String(c || "").trim() === "")) continue;

                const col = {};
                headers.forEach((h, idx) => {
                    if (h !== "") {
                        col[h] = cells[idx] !== undefined ? String(cells[idx]).trim() : "";
                    }
                });

                const no         = col["track no"] || "";
                const trackName  = col["Track Name"] || "";
                const artistName = col["Artist Name(s)"] || "";
                const memo       = col["Listening Memo"] || "";
                const points     = col["point"] || "";
                const mood       = col["mood"] || "";
                const texture    = col["texture"] || "";
                const link       = col["Link"] || "";
                const flag       = col["フラグ"] || "";

                if (!no) continue;
                if (!trackName && !artistName) continue;
                if (flag === "除外") continue;
                if (blogOnly && flag !== "ブログ候補") continue;

                items.push({
                    no,
                    trackName,
                    artistName,
                    memo,
                    points,
                    mood,
                    texture,
                    spotifyId: extractSpotifyTrackId(link)
                });
            }
            return items;
        }

        function extractSpotifyTrackId(val) {
            const s = String(val || "").trim();
            if (!s) return "";
            const m1 = s.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/([a-zA-Z0-9]+)/);
            if (m1) return m1[1];
            const m2 = s.match(/spotify:track:([a-zA-Z0-9]+)/);
            if (m2) return m2[1];
            if (/^[a-zA-Z0-9]{20,24}$/.test(s)) return s;
            return "";
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatMemoHtml(memoText) {
            if (!memoText) return '<p class="text-slate-500">（メモなし）</p>';
            const lines = String(memoText).split(/\r?\n/);
            return lines.map(line => {
                const trimmed = line.trim();
                if (!trimmed) return '<div class="h-1"></div>';
                let safe = escapeHtml(trimmed);
                safe = safe.replace(/(【[^】]+】)/g, '<strong class="text-indigo-300 font-semibold">$1</strong>');
                if (trimmed.startsWith('→')) {
                    return `<p class="text-emerald-300/95 font-medium pl-1 border-l-2 border-emerald-500/60">${safe}</p>`;
                }
                return `<p>${safe}</p>`;
            }).join('');
        }

        function resetDeck() {
            undrawnIndices = tracksData.map((_, idx) => idx);
            if (tracksData.length > 1 && currentItem) {
                const lastIdx = tracksData.findIndex(t => t.no === currentItem.no && t.trackName === currentItem.trackName);
                if (lastIdx !== -1 && undrawnIndices.length > 1) {
                    undrawnIndices = undrawnIndices.filter(i => i !== lastIdx);
                }
            }
        }

        function updateNavigationButtons() {
            if (historyIndex > 0) {
                backBtn.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                backBtn.classList.add('opacity-40', 'pointer-events-none');
            }
            if (totalCountEl) totalCountEl.textContent = tracksData.length;
            if (remainingCountEl) remainingCountEl.textContent = undrawnIndices.length;

            if (drawBtnText) {
                if (tracksData.length === 0) {
                    drawBtnText.textContent = 'データなし（シートURLを確認）';
                } else if (historyIndex < cardHistory.length - 1) {
                    drawBtnText.textContent = '次の履歴へ進む';
                } else if (undrawnIndices.length === 0) {
                    drawBtnText.textContent = '全曲完了（最初から引き直す）';
                } else {
                    drawBtnText.textContent = 'カードを引く';
                }
            }
        }

        function renderCard() {
            if (!currentItem) {
                cardNo.textContent = "No. --";
                cardTitle.textContent = "シートURLが未設定です";
                cardArtist.textContent = "右下の「シートURL設定」から公開CSV URLを入力してください";
                cardMemo.innerHTML = '<p class="text-slate-400">スプレッドシートを「ウェブに公開（CSV）」にすると、HTMLを再アップロードせずに曲データを更新できます。</p>';
                spotifyEmbedContainer.classList.add('hidden');
                spotifyIframe.src = "";
                return;
            }

            cardNo.textContent = `No. ${currentItem.no}`;
            cardTitle.textContent = currentItem.trackName || '（タイトルなし）';
            cardArtist.textContent = currentItem.artistName || '（アーティスト不明）';
            cardMemo.innerHTML = formatMemoHtml(currentItem.memo);

            if (showAllFields) {
                metaBadges.classList.remove('hidden');
                pointsWrapper.classList.remove('hidden');
                cardMood.textContent = currentItem.mood ? `mood: ${currentItem.mood}` : 'mood: -';
                cardTexture.textContent = currentItem.texture ? `texture: ${currentItem.texture}` : 'texture: -';

                cardPoints.innerHTML = '';
                if (currentItem.points) {
                    currentItem.points.split(',').forEach(pt => {
                        const t = pt.trim();
                        if (!t) return;
                        const span = document.createElement('span');
                        span.className = 'text-[10px] bg-indigo-950/90 text-indigo-300 border border-indigo-800/60 px-2 py-0.5 rounded';
                        span.textContent = t;
                        cardPoints.appendChild(span);
                    });
                }
            } else {
                metaBadges.classList.add('hidden');
                pointsWrapper.classList.add('hidden');
            }

            if (currentItem.spotifyId) {
                const targetSrc = `https://open.spotify.com/embed/track/${currentItem.spotifyId}`;
                if (spotifyIframe.src !== targetSrc) {
                    spotifyIframe.src = targetSrc;
                }
                spotifyEmbedContainer.classList.remove('hidden');
            } else {
                spotifyEmbedContainer.classList.add('hidden');
                spotifyIframe.src = "";
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STATE_KEY, JSON.stringify({
                    currentItem,
                    cardHistory,
                    historyIndex,
                    undrawnIndices,
                    showAllFields
                }));
            } catch (e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STATE_KEY);
                if (!raw) return false;
                const state = JSON.parse(raw);
                if (!state || !state.currentItem || !Array.isArray(state.cardHistory) || state.cardHistory.length === 0) {
                    return false;
                }
                currentItem = state.currentItem;
                cardHistory = state.cardHistory;
                historyIndex = typeof state.historyIndex === 'number' ? state.historyIndex : cardHistory.length - 1;
                undrawnIndices = Array.isArray(state.undrawnIndices) ? state.undrawnIndices : [];
                if (typeof state.showAllFields === 'boolean') {
                    showAllFields = state.showAllFields;
                    applyModeButtons();
                }
                updateNavigationButtons();
                renderCard();
                return true;
            } catch (e) {
                return false;
            }
        }

        function applyModeButtons() {
            if (showAllFields) {
                mode6Btn.className = "px-2 py-1 rounded-md bg-indigo-600 text-white font-medium transition cursor-pointer";
                mode3Btn.className = "px-2 py-1 rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer";
            } else {
                mode3Btn.className = "px-2 py-1 rounded-md bg-indigo-600 text-white font-medium transition cursor-pointer";
                mode6Btn.className = "px-2 py-1 rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer";
            }
        }

        function drawCard() {
            if (!tracksData || tracksData.length === 0) return;

            if (historyIndex < cardHistory.length - 1) {
                historyIndex++;
                currentItem = cardHistory[historyIndex];
                updateNavigationButtons();
                renderCard();
                saveState();
                return;
            }

            if (undrawnIndices.length === 0) {
                resetDeck();
            }

            const randPos = Math.floor(Math.random() * undrawnIndices.length);
            const nextIdx = undrawnIndices.splice(randPos, 1)[0];
            currentItem = tracksData[nextIdx];

            cardHistory.push(currentItem);
            historyIndex = cardHistory.length - 1;
            updateNavigationButtons();
            renderCard();
            saveState();
        }

        function backCard() {
            if (historyIndex > 0) {
                historyIndex--;
                currentItem = cardHistory[historyIndex];
                updateNavigationButtons();
                renderCard();
                saveState();
            }
        }

        async function syncFromSheets(forceNewDeck = false) {
            const cfg = loadConfig();
            filterBadgeEl.classList.toggle('hidden', !cfg.blogOnly);

            if (!cfg.csvUrl) {
                syncStatusEl.textContent = "シートURL未設定";
                updateNavigationButtons();
                renderCard();
                return;
            }

            syncStatusEl.textContent = "同期中...";
            try {
                const sep = cfg.csvUrl.includes("?") ? "&" : "?";
                const fetchUrl = `${cfg.csvUrl}${sep}_t=${Date.now()}`;
                const res = await fetch(fetchUrl, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const csvText = await res.text();
                const rows = parseCSV(csvText);
                const parsed = rowsToTracks(rows, cfg.blogOnly);
                if (parsed.length === 0) throw new Error("有効な行が見つかりません");

                tracksData = parsed;
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        tracks: tracksData,
                        updatedAt: new Date().toISOString()
                    }));
                } catch (e) {}

                const nowStr = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                syncStatusEl.textContent = `同期済 (${nowStr})`;

                if (forceNewDeck || !currentItem) {
                    currentItem = null;
                    cardHistory = [];
                    historyIndex = -1;
                    resetDeck();
                    drawCard();
                } else {
                    const refreshedCurrent = tracksData.find(t => t.no === currentItem.no && t.trackName === currentItem.trackName);
                    if (refreshedCurrent) {
                        currentItem = refreshedCurrent;
                        if (historyIndex >= 0 && cardHistory[historyIndex]) {
                            cardHistory[historyIndex] = refreshedCurrent;
                        }
                    } else {
                        currentItem = null;
                    }
                    undrawnIndices = tracksData
                        .map((_, idx) => idx)
                        .filter(idx => {
                            const t = tracksData[idx];
                            return !cardHistory.some(h => h.no === t.no && h.trackName === t.trackName);
                        });
                    if (!currentItem) {
                        drawCard();
                    } else {
                        updateNavigationButtons();
                        renderCard();
                        saveState();
                    }
                }
            } catch (err) {
                syncStatusEl.textContent = `同期エラー (${err.message})`;
                if (tracksData.length === 0) {
                    try {
                        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
                        if (cached && Array.isArray(cached.tracks) && cached.tracks.length > 0) {
                            tracksData = cached.tracks;
                            if (!loadState()) {
                                resetDeck();
                                drawCard();
                            }
                        }
                    } catch (e) {}
                }
                updateNavigationButtons();
                renderCard();
            }
        }

        mode6Btn.addEventListener('click', () => {
            showAllFields = true;
            applyModeButtons();
            renderCard();
            saveState();
        });

        mode3Btn.addEventListener('click', () => {
            showAllFields = false;
            applyModeButtons();
            renderCard();
            saveState();
        });

        drawBtn.addEventListener('click', drawCard);
        backBtn.addEventListener('click', backCard);
        syncBtn.addEventListener('click', () => syncFromSheets(false));

        resetBtn.addEventListener('click', () => {
            localStorage.removeItem(STATE_KEY);
            currentItem = null;
            cardHistory = [];
            historyIndex = -1;
            resetDeck();
            drawCard();
        });

        copyQueryBtn.addEventListener('click', async () => {
            if (!currentItem) return;
            const text = `${currentItem.artistName || ""} ${currentItem.trackName || ""}`.trim();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                const orig = copyQueryBtn.textContent;
                copyQueryBtn.textContent = "コピーしました";
                setTimeout(() => { copyQueryBtn.textContent = orig; }, 1200);
            } catch (e) {}
        });

        openSettingsBtn.addEventListener('click', () => {
            const cfg = loadConfig();
            csvUrlInput.value = cfg.csvUrl;
            blogOnlyCheckbox.checked = cfg.blogOnly;
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        });

        saveSyncBtn.addEventListener('click', () => {
            const cfg = {
                csvUrl: csvUrlInput.value.trim(),
                blogOnly: blogOnlyCheckbox.checked
            };
            saveConfig(cfg);
            filterBadgeEl.classList.toggle('hidden', !cfg.blogOnly);
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
            syncFromSheets(true);
        });

        (function init() {
            const cfg = loadConfig();
            filterBadgeEl.classList.toggle('hidden', !cfg.blogOnly);

            try {
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
                if (cached && Array.isArray(cached.tracks) && cached.tracks.length > 0) {
                    tracksData = cached.tracks;
                    if (!loadState()) {
                        resetDeck();
                        drawCard();
                    }
                }
            } catch (e) {}

            updateNavigationButtons();
            renderCard();
            if (cfg.csvUrl) {
                syncFromSheets(false);
            }
        })();
    </script>
</body>
</html>
